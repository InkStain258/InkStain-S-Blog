name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # onlyBuiltDependencies 已在 pnpm-workspace.yaml 里放行 esbuild/sharp/workerd
      - name: Install
        run: pnpm install --frozen-lockfile

      # 仓库没有 ESLint 配置，先只做类型检查（next.config 里 ignoreBuildErrors 仍为 true，
      # 这一关就是为了在合并前把类型错误拦下来，而不是等 Vercel 构建放行）
      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm exec next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # 构建后自检：robots / sitemap / rss 必须存在且域名正确
      - name: Verify SEO routes
        run: node scripts/verify-seo-routes.mjs
        env:
          NEXT_TELEMETRY_DISABLED: '1'
